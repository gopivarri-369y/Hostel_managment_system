<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Registration - Hostel Management System</title>
    <link rel="stylesheet" href="../css/owner_register.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="header">
                <h1>Owner Registration</h1>
                <button type="button" onclick="window.location.href='/'" class="home-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Home
                </button>
            </div>

            <form id="registrationForm" method="post" action="/owner/register">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" placeholder="Enter your age" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Contact Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-input">
                                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                                <button type="button" class="toggle-password" onclick="togglePassword()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Hostel Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="collage">Nearest College</label>
                            <input type="text" id="collage" name="college" placeholder="Enter the nearest college name" required>
                        </div>
                        <div class="form-group">
                            <label for="pincode">Pincode</label>
                            <input type="number" id="pincode" name="pincode" placeholder="Enter the pincode" required>
                        </div>
                        <div class="form-group">
                            <label for="hostelName">Hostel Name</label>
                            <input type="text" id="hostelName" name="hostel_name" placeholder="Enter the hostel name" required>
                        </div>
                        <div class="form-group">
                            <label for="roomsFor">Rooms For</label>
                            <select id="roomsFor" name="rooms_for">
                                <option value="boys">Boys</option>
                                <option value="girls">Girls</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Room Details</h2>
                    <div class="room-grid">
                        <div class="room-type">
                            <h3>2 Share Rooms</h3>
                            <div class="form-group">
                                <label for="twoShareRooms">Number of Rooms</label>
                                <input type="number" id="twoShareRooms" name="twoshare" placeholder="Number of rooms">
                            </div>
                            <div class="form-group">
                                <label for="twoShareRent">Rent per Room</label>
                                <input type="number" id="twoShareRent" name="tworent" placeholder="Enter room rent">
                            </div>
                        </div>
                        <div class="room-type">
                            <h3>3 Share Rooms</h3>
                            <div class="form-group">
                                <label for="threeShareRooms">Number of Rooms</label>
                                <input type="number" id="threeShareRooms" name="threeshare" placeholder="Number of rooms">
                            </div>
                            <div class="form-group">
                                <label for="threeShareRent">Rent per Room</label>
                                <input type="number" id="threeShareRent" name="threerent" placeholder="Enter room rent">
                            </div>
                        </div>
                        <div class="room-type">
                            <h3>4 Share Rooms</h3>
                            <div class="form-group">
                                <label for="fourShareRooms">Number of Rooms</label>
                                <input type="number" id="fourShareRooms" name="fourshare" placeholder="Number of rooms">
                            </div>
                            <div class="form-group">
                                <label for="fourShareRent">Rent per Room</label>
                                <input type="number" id="fourShareRent" name="fourrent" placeholder="Enter room rent">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Submit Registration</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/owner_register.js"></script>
</body>
</html>
