<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hostel Management System</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/student_login.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="login-container" data-aos="fade-up">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Please enter your details to sign in</p>
        </div>

        <div id="loginError" class="form-error-banner" style="display: none;"></div>
        <form id="loginForm" action="/login-owner" method="post">
            <div class="form-group">
                <label for="types" class="form-label">User Type</label>
                <i class="fas fa-user input-icon"></i>
                <select name="types" id="types" class="form-select">
                    <option value="owners">Owner</option>
                    <option value="students">Student</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" name="email" id="email" class="form-input" placeholder="Enter your email" required>
                <div class="form-error">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" id="password" class="form-input" placeholder="Enter your password" required>
                <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                <div class="form-error">Password is required</div>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="/forgot-password" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="submit-button">
                <span>Sign In</span>
                <div class="spinner"></div>
            </button>

            <div class="register-link">
                Don't have an account? <a href="/register">Register now</a>
            </div>

            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </form>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="../js/student_login.js"></script>
</body>
</html>
